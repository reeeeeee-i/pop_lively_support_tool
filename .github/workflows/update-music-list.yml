name: 曲リストの自動更新

on:
  schedule:
    - cron: "0 0 * * 0"   # 毎週日曜 9:00 (日本時間)。GitHub の cron は UTC
  workflow_dispatch:       # 手動実行

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-music-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wiki から HTML を取得
        run: python tools/fetch_wiki.py tmp_scrape

      - name: 曲リストを生成
        run: |
          cp popn_music_list.json "$RUNNER_TEMP/before.json"
          python generate_music_list.py

      - name: 変更の有無を確認
        id: diff
        run: |
          if git diff --quiet -- popn_music_list.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "曲リストに変更はありません"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 異常がないか検査
        if: steps.diff.outputs.changed == 'true'
        run: python tools/check_music_list.py "$RUNNER_TEMP/before.json" popn_music_list.json

      - name: 署名
        if: steps.diff.outputs.changed == 'true'
        env:
          SIGNING_KEY: ${{ secrets.POP_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "::error::Secrets の POP_SIGNING_KEY が未設定です"; exit 1; }
          umask 077
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/signing_key.hex"
          python tools/sign_release.py sign-music popn_music_list.json --key "$RUNNER_TEMP/signing_key.hex"
          python tools/sign_release.py verify popn_music_list.json
          rm -f "$RUNNER_TEMP/signing_key.hex"

      - name: プルリクエストを作ってマージ
        if: steps.diff.outputs.changed == 'true'
        run: |
          branch="auto/music-list-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add popn_music_list.json popn_music_list.json.sig
          git commit -m "曲リストを自動更新する"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "曲リストの自動更新 ($(date -u +%Y-%m-%d))" \
            --body "Wiki から曲リストを再生成し、署名しました (自動)。")
          gh pr merge "$url" --merge --delete-branch
